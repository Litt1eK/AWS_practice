version: '3.8'

services:
  # 1. 模擬 Amazon RDS (MySQL)
  my-rds-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=testpass
      - MYSQL_DATABASE=testdb
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql 
    command: --default-authentication-plugin=mysql_native_password

  # 2. 模擬 AWS Lambda 函數
  backend:
    build: ./Backend
    environment:
      - PORT=8080
      - DB_HOST=my-rds-db
      - DB_USER=root
      - DB_PASSWORD=testpass
      - DB_NAME=testdb
    depends_on:
      - my-rds-db # 等資料庫起來再啟動

  # 3. 模擬 Amazon ECS (前端網頁)
  frontend:
    build: ./Frontend
    ports:
      - "80:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend